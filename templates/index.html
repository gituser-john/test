<!DOCTYPE html>
<html>
<head>
    <title>EasyOCR Demo</title>
</head>
<body>
    <h2>Upload Image for OCR (EasyOCR)</h2>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="image" required>
        <button type="submit">Upload</button>
    </form>

    <h3>Extracted Text:</h3>
    <pre>{{ text }}</pre>
</body>
</html>
